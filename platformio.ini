; RTK Bridge - UM981 <-> Android, ESP32-WROOM-32 (38 pin, CP2102)
; The sources live in RTKBridge/ so the same tree opens directly in the
; Arduino IDE (sketch folder name must match the .ino inside it).
[platformio]
src_dir = RTKBridge

[env:esp32dev]
platform      = espressif32@^6.9.0
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
build_flags   =
    -DCORE_DEBUG_LEVEL=3
